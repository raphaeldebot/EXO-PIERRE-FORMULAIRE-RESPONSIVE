<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exo Pierre formulaire responsive</title>
</head>

<body>
    <h1>Formulaire Responsive</h1>
    <form action="">
        <fieldset>
            <legend>Votre identité</legend>
            <label for="nom">Nom</label>
            <input type="text" name="nom" id="nom">
            <label for="prenom">Prénom</label>
            <input type="text" name="prenom" id="prenom">
        </fieldset>
        <fieldset>
            <legend>Vos coordonnées</legend>
            <label for="rue">Rue</label>
            <input type="text" name="rue" id="rue">
            <label for="numero">Numéro</label>
            <input type="text" name="numero" id="numero">
            <label for="codepost">Code postal</label>
            <input type="text" name="codepost" id="codepost">
            <label for="ville">Ville</label>
            <input type="text" name="ville" id="ville">
        </fieldset>
        <fieldset>
            <legend>Vos préférence</legend>
            <label>Langue utilisées</label>
            <input type="radio" id="francais">
            <label for="francais">Français</label>
            <input type="radio" id="neerlandais">
            <label for="neerlandais">Néerlandais</label>
            <input type="radio" id="allemand">
            <label for="allemand">Allemand</label>
            <input type="radio" id="anglais">
            <label for="anglais">Anglais</label>
            <label>Activités</label>
            <label for="cinema">Activités</label>
            <input type="checkbox" id="cinema">
            <label for=""></label>
            
            <label for=""></label>
            
            <label for=""></label>
            
        </fieldset>
    </form>
</body>

</html>
